services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dental_alameda
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dental}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental -d dental_alameda"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=dental_alameda;Username=dental;Password=${DB_PASSWORD:-dental}
      Jwt__Key: ${JWT_KEY:-cambia-esta-clave-de-desarrollo-de-32-caracteres-o-mas}
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@dentalalameda.co}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-Admin123*}
      Swagger__Enabled: "true"
      Clinica__Nombre: ${CLINICA_NOMBRE:-Clínica Dental Alameda}
      Clinica__Direccion: "${CLINICA_DIRECCION:-Calle 00 # 00-00, consultorio 201}"
      WhatsApp__Proveedor: ${WHATSAPP_PROVEEDOR:-Consola}
      Twilio__AccountSid: ${TWILIO_ACCOUNT_SID:-}
      Twilio__AuthToken: ${TWILIO_AUTH_TOKEN:-}
      Twilio__From: ${TWILIO_FROM:-+14155238886}
      Twilio__PlantillaConfirmacion: ${TWILIO_PLANTILLA_CONFIRMACION:-}
      Twilio__PlantillaCancelacion: ${TWILIO_PLANTILLA_CANCELACION:-}
    ports:
      - "5080:8080"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
